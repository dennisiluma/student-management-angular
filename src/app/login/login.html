<div class="container">
    <div class="card">
        <div class="header">
            <h2 class="title">Welcome Back</h2>
            <p class="subtitle">Sign in to access your dashboard</p>
        </div>

        @if (error()) {
        <div class="errorAlert">{{ error() }}</div>
        }

        <form (ngSubmit)="handleSubmit()" class="form">
            <div class="field">
                <label class="label">Email Address</label>
                <input type="email" [(ngModel)]="email" name="email" class="input" placeholder="user@school.edu"
                    required />
            </div>

            <div class="field">
                <label class="label">Password</label>
                <input type="password" [(ngModel)]="password" name="password" class="input" placeholder="••••••••"
                    required />
            </div>

            <button type="submit" [disabled]="loading()" class="submitBtn">
                {{ loading() ? 'Authenticating...' : 'Sign In' }}
            </button>
        </form>

        <p class="footer">
            Don't have an account?
            <a routerLink="/register" class="link">
                Register
            </a>
        </p>
    </div>
</div>
