<div class="container">
    <div class="card">
        <div class="header">
            <h2 class="title">Create Account</h2>
            <p class="subtitle">Register as a student or teacher</p>
        </div>

        @if (error()) {
        <div class="errorAlert">{{ error() }}</div>
        }

        <form (ngSubmit)="handleSubmit()" class="form">
            <div class="field">
                <label class="label">First Name</label>
                <input type="text" class="input" placeholder="Daniel" [(ngModel)]="firstName" name="firstName"
                    required />
            </div>

            <div class="field">
                <label class="label">Last Name</label>
                <input type="text" class="input" placeholder="Dave" [(ngModel)]="lastName" name="lastName" required />
            </div>

            <div class="field">
                <label class="label">Email Address</label>
                <input type="email" class="input" placeholder="user@school.edu" [(ngModel)]="email" name="email"
                    required />
            </div>

            <div class="field">
                <label class="label">Password</label>
                <input type="password" class="input" placeholder="••••••••" [(ngModel)]="password" name="password"
                    required />
            </div>

            <div class="field">
                <label class="label">Account Role</label>
                <select class="select" [(ngModel)]="role" name="role">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <button type="submit" [disabled]="loading()" class="submitBtn">
                {{ loading() ? 'Creating Account...' : 'Register Account' }}
            </button>
        </form>

        <p class="footer">
            Already registered?
            <a routerLink="/login" class="link">Sign In</a>
        </p>
    </div>
</div>
